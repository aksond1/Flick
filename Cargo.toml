[package]
name = "flick"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Region screenshots and screen recording for Hyprland"
repository = "https://github.com/aksond1/Flick"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.9", features = ["derive"] }
directories = "6.0.0"
gst = { version = "0.25", package = "gstreamer" }
gtk = { version = "0.11", package = "gtk4", features = ["v4_16"] }
gtk4-layer-shell = "0.9"
pangocairo = "0.22"
png = "0.18.1"
rustix = { version = "1", features = ["fs", "mm", "pipe", "process", "event", "std"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.2"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dev-dependencies]
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
